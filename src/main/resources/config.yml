    A: { enabled: true, lagback: { vl: 35 }, punishment: { enabled: true, vl: 350 } }
    B: { enabled: false }
    C: { enabled: true, lagback: { vl: 75 }, punishment: { enabled: true, vl: 350 } }
    D: { enabled: true, lagback: { vl: 75 }, punishment: { enabled: true, vl: 350 } }

