# ❖ CORE SETTINGS ❖
settings:
  # The display name used in menus, prefix tags, and alerts
  plugin-name: "Truthful"
  # Prefix used by Geyser/Floodgate to identify Bedrock players (e.g. ".", "*", or "_")
  bedrock-prefix: "."

# ❖ GLOBAL OPTIONS ❖
options:
  # Global lagback toggle. If a check does not have a specific lagback config, it falls back to this.
  lagback: false
  # Enable deep logging in the console for developer debugging
  debug-mode: false
  # Automatically reset player violation levels every X minutes
  violation-reset-interval: 5
  # The minimum Server TPS required before Truthful temporarily suspends strict physics checks
  min-tps: 18.5
  # How often (in ticks) to scan a player's environment (vehicles, entities nearby)
  environment-scan-interval-ticks: 10

  alerts:
    # If true, staff with 'truthful.alerts' permission will have alerts enabled automatically on join.
    auto-enable-on-join: true

  punishment:
    # Broadcast a message globally when a player is punished
    broadcast: true
    # Strike lightning at the player's location upon ban/kick
    lightning: false

# ❖ LATENCY KICKER ❖
# Prevents extreme lag-spoofing and server desync exploits.
latency-kicker:
  enabled: true
  max-ping: 650
  duration-seconds: 3
  probe-interval-ticks: 2
  kick-message: "&cInternal Exception: java.io.IOException: An existing connection was forcibly closed by the remote host"

# ❖ CLIENT BLOCKER ❖
# Blacklist specific modded clients by checking their internal payload brand.
client-blocker:
  enabled: true
  blocked-brands:
    - "vivecraft"
    - "worlddownloader"
  kick-message: "&cThis client modification is not permitted on this server."

# ❖ PERFORMANCE SYNC ❖
# Internal buffer sizes. Do not change unless instructed by support.
sync:
  max-entries: 50
  entry-ttl-millis: 5000

# ❖ BANDWAVE (PUNISHMENT QUEUE) ❖
# Queue hackers to be banned all at once rather than instantly, causing paranoia among cheat developers.
bandwave:
  enabled: false
  # Delay between kicking each player during an active wave
  interval-seconds: 5
  auto-start:
    enabled: false
    day: "SUNDAY"
    time: "18:00"

# ❖ DISCORD WEBHOOKS ❖
discord:
  enabled: false
  webhook-url: ""
  min-vl: 10
  username: "Truthful Watchdog"
  avatar-url: ""
  embed:
    color: 16733525
    footer: "Truthful Anti-Cheat"
    show-player-head: true

# ❖ MESSAGES ❖
messages:
  alert: '&8[&e🏹&8] &9%player% &ffailed &e%check% &8(&fVL:%vl%&8) &f%debug%'
  brand: '&8[&e🏹&8] &f%player% &7is using &b%brand%'
  punishment-broadcast: '&eANTI&9CHEAT &cRemoved &c❌ &f%player% &c❌'
  alerts-enabled: "&8[&bTruthful&8] &7Alerts have been &aenabled&7."
  alerts-disabled: "&8[&bTruthful&8] &7Alerts have been &cdisabled&7."

  bandwave-sweep: "&8[&5&lBANDWAVE&8] &7#%position% swept by the band wave: &f%player%"
  bandwave-queued: "&8[&5&lBANDWAVE&8] &f%player% &7was added to the BANDWAVE queue."
  bandwave-duplicate: "&8[&5&lBANDWAVE&8] &f%player% &7is already queued."
  bandwave-started: "&8[&5&lBANDWAVE&8] &7Execution started."
  bandwave-stopped: "&8[&5&lBANDWAVE&8] &7Execution stopped."
  bandwave-empty: "&8[&5&lBANDWAVE&8] &7Queue is empty."
  bandwave-cleared: "&8[&5&lBANDWAVE&8] &7Queue cleared."
  bandwave-status: "&8[&5&lBANDWAVE&8] &7Running: &f%running% &8| &7Queued: &f%queued%"
  bandwave-list-header: "&8[&5&lBANDWAVE&8] &7Queued players (&f%queued%&7):"
  bandwave-list-entry: "&8 - &f%position%. %player%"
  bandwave-usage: "&cUsage: /bandwave <add|remove|list|start|stop|clear|status> [player]"
  bandwave-disabled: "&8[&5&lBANDWAVE&8] &cBANDWAVE is disabled in config."
  bandwave-removed: "&8[&5&lBANDWAVE&8] &f%player% &7was removed from the queue."
  bandwave-schedule: "&8[&5&lBANDWAVE&8] &7Auto-start: &f%enabled% &8| &7Day: &f%day% &8| &7Time: &f%time%"

  commands:
    only-players: "&cOnly players can use this command."
    no-permission: "&cNo permission."
    no-data: "&cError: No data found."

