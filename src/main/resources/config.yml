# ============================================================================== #
#                                                                                #
#               T R U T H F U L   A N T I - C H E A T   C O N F I G              #
#                                                                                #
# ============================================================================== #

# -- CORE SETTINGS --
settings:
  # The display name used in menus, prefix tags, and alerts
  plugin-name: "&9&lT&e&lAC"
  # Prefix used by Geyser/Floodgate to identify Bedrock players (e.g. ".", "*", or "_")
  bedrock-prefix: "."

# -- GLOBAL OPTIONS --
options:
  # Global lagback toggle. If a check does not have a specific lagback config, it falls back to this.
  lagback: true

  # Lagback severity mode: BARELY, MODERATE, STRICT, SUPER_STRICT
  # BARELY        - Minimal intervention; only setback if >8 blocks from safe position
  # MODERATE      - Balanced; setback when flagged while airborne or on ground violation
  # STRICT        - Aggressive; setback every flag with short cooldown
  # SUPER_STRICT  - Grim-like; instant setback, no cooldown, freeze until confirmed
  lagback-mode: MODERATE

  # Maximum distance between player's current position and safe setback target before snapping to ground
  lagback-ground-snap-distance: 5.0

  # Enable deep logging in the console for developer debugging
  debug-mode: false
  # Automatically reset player violation levels every X minutes
  violation-reset-interval: 5
  # The minimum Server TPS required before Truthful temporarily suspends strict physics checks
  min-tps: 18.5
  # How often (in ticks) to scan a player's environment (vehicles, entities nearby)
  environment-scan-interval-ticks: 10

  profiles:
    enabled: true
    default-recording-seconds: 30

  alerts:
    auto-enable-on-join: true

  punishment:
    broadcast: true
    lightning: false

# -- LATENCY KICKER --
# Automatically disconnects extreme ping-spoofers and lag-exploiters.
latency-kicker:
  enabled: true
  max-ping: 650
  duration-seconds: 3
  probe-interval-ticks: 2
  kick-message: "&cInternal Exception: java.io.IOException: An existing connection was forcibly closed by the remote host"

# -- CLIENT BLOCKER --
# Blacklist specific modded clients by checking their internal payload brand on join.
client-blocker:
  enabled: true
  blocked-brands:
    - "vivecraft"
    - "worlddownloader"
  kick-message: "&cThis client modification is not permitted on this server."

# -- PERFORMANCE SYNC --
sync:
  max-entries: 50
  entry-ttl-millis: 5000

# -- BANWAVE (PUNISHMENT QUEUE) --
# Queue hackers to be banned in periodic waves rather than instantly.
banwave:
  enabled: false
  interval-seconds: 5
  auto-start:
    enabled: false
    day: "SUNDAY"
    time: "18:00"

# -- DISCORD WEBHOOKS --
discord:
  enabled: false
  webhook-url: ""
  min-vl: 10
  username: "Truthful Watchdog"
  avatar-url: ""
  embed:
    color: 16733525
    footer: "Truthful Anti-Cheat"
    show-player-head: true

# -- MESSAGES --
messages:
  alert: '&8[&cTruthful&8] &c%player% &ffailed &c%check% &8(&fVL:%vl%&8)'
  brand: '&8[&cTruthful&8] &f%player% &7is using &b%brand%'
  punishment-broadcast: '&8[&cTruthful&8] &c%player% &fwas removed for cheating.'
  alerts-enabled: "&8[&bTruthful&8] &7Alerts &aenabled&7."
  alerts-disabled: "&8[&bTruthful&8] &7Alerts &cdisabled&7."

  alert-settings:
    hover-enabled: true
    show-check-type: true
    show-ping: true
    show-tps: true
    show-vl: true
    show-client-brand: true
    show-coordinates: false
    hover-lines:
      - '&7Debug:'
      - '&f%debug%'

  banwave-sweep: "&8[&5BANWAVE&8] &7#%position% swept: &f%player%"
  banwave-queued: "&8[&5BANWAVE&8] &f%player% &7queued for ban wave."
  banwave-duplicate: "&8[&5BANWAVE&8] &f%player% &7is already queued."
  banwave-started: "&8[&5BANWAVE&8] &7Execution started."
  banwave-stopped: "&8[&5BANWAVE&8] &7Execution stopped."
  banwave-empty: "&8[&5BANWAVE&8] &7Queue is empty."
  banwave-cleared: "&8[&5BANWAVE&8] &7Queue cleared."
  banwave-status: "&8[&5BANWAVE&8] &7Running: &f%running% &8| &7Queued: &f%queued%"
  banwave-list-header: "&8[&5BANWAVE&8] &7Queued players (&f%queued%&7):"
  banwave-list-entry: "&8 - &f%position%. %player%"
  banwave-usage: "&cUsage: /banwave <add|remove|list|start|stop|clear|status> [player]"
  banwave-disabled: "&8[&5BANWAVE&8] &cBANWAVE is disabled in config."
  banwave-removed: "&8[&5BANWAVE&8] &f%player% &7removed from queue."
  banwave-schedule: "&8[&5BANWAVE&8] &7Auto-start: &f%enabled% &8| &7Day: &f%day% &8| &7Time: &f%time%"

  commands:
    only-players: "&cOnly players can use this command."
    no-permission: "&cNo permission."
    no-data: "&cError: No data found."

