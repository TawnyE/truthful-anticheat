# ❖ CORE SETTINGS ❖
settings:
  # The display name used in menus, prefix tags, and alerts
  plugin-name: "&9&lT&e&lAC"
  # Prefix used by Geyser/Floodgate to identify Bedrock players (e.g. ".", "*", or "_")
  bedrock-prefix: "."

# ❖ GLOBAL OPTIONS ❖
options:
  # Global lagback toggle. If a check does not have a specific lagback config, it falls back to this.
  lagback: true

  # Lagback severity mode: BARELY, MODERATE, STRICT, SUPER_STRICT
  # BARELY        - Minimal intervention; only setback if >8 blocks from safe position
  #                 (500ms cooldown, distance threshold 8.0 blocks, no airborne setback)
  # MODERATE      - Balanced; setback when flagged while airborne
  #                 (80ms cooldown, no distance threshold, airborne setback enabled)
  # STRICT        - Aggressive; setback every flag with short cooldown
  #                 (100ms cooldown, no distance threshold, airborne setback enabled)
  # SUPER_STRICT  - Grim-like; instant setback, no cooldown, freeze until confirmed
  #                 (0ms cooldown, no distance threshold, airborne setback enabled)
  lagback-mode: MODERATE

  # Maximum distance between the player's current position and the resolved setback target.
  # If the stored safe location is farther than this distance, the system will snap the
  # setback target to the nearest ground beneath the player's current position instead,
  # preventing rubber-banding across the map during fly/high-velocity cheats.
  lagback-ground-snap-distance: 5.0

  # Enable deep logging in the console for developer debugging
  debug-mode: false
  # Automatically reset player violation levels every X minutes
  violation-reset-interval: 5
  # The minimum Server TPS required before Truthful temporarily suspends strict physics checks
  min-tps: 18.5
  # How often (in ticks) to scan a player's environment (vehicles, entities nearby)
  environment-scan-interval-ticks: 10

  alerts:
    # If true, staff with 'truthful.alerts' permission will have alerts enabled automatically on join.
    auto-enable-on-join: true

  punishment:
    # Broadcast a message globally when a player is punished
    broadcast: true
    # Strike lightning at the player's location upon ban/kick
    lightning: false

# ❖ LATENCY KICKER ❖
# Prevents extreme lag-spoofing and server desync exploits.
latency-kicker:
  enabled: true
  max-ping: 650
  duration-seconds: 3
  probe-interval-ticks: 2
  kick-message: "&cInternal Exception: java.io.IOException: An existing connection was forcibly closed by the remote host"

# ❖ CLIENT BLOCKER ❖
# Blacklist specific modded clients by checking their internal payload brand.
client-blocker:
  enabled: true
  blocked-brands:
    - "vivecraft"
    - "worlddownloader"
  kick-message: "&cThis client modification is not permitted on this server."

# ❖ PERFORMANCE SYNC ❖
# Internal buffer sizes. Do not change unless instructed by support.
sync:
  max-entries: 50
  entry-ttl-millis: 5000

# ❖ BANDWAVE (PUNISHMENT QUEUE) ❖
# Queue hackers to be banned all at once rather than instantly, causing paranoia among cheat developers.
bandwave:
  enabled: false
  # Delay between kicking each player during an active wave
  interval-seconds: 5
  auto-start:
    enabled: false
    day: "SUNDAY"
    time: "18:00"

# ❖ DISCORD WEBHOOKS ❖
discord:
  enabled: false
  webhook-url: ""
  min-vl: 10
  username: "Truthful Watchdog"
  avatar-url: ""
  embed:
    color: 16733525
    footer: "Truthful Anti-Cheat"
    show-player-head: true

# ❖ MESSAGES ❖
messages:
  alert: '&8[&e🏹&8] &9%player% &ffailed &e%check% &8(&fVL:%vl%&8) &f%debug%'
  brand: '&8[&e🏹&8] &f%player% &7is using &b%brand%'
  punishment-broadcast: '&eANTI&9CHEAT &cRemoved &c❌ &f%player% &c❌'
  alerts-enabled: "&8[&bTruthful&8] &7Alerts have been &aenabled&7."
  alerts-disabled: "&8[&bTruthful&8] &7Alerts have been &cdisabled&7."

  # ❖ ALERT HOVER TEXT CUSTOMIZATION ❖
  # Controls the hover tooltip shown when staff hover over alert messages in chat.
  alert-settings:
    # Whether to show hover text at all
    hover-enabled: true
    # Toggle specific information in the alert system
    show-check-type: true
    show-ping: true
    show-tps: true
    show-vl: true
    show-client-brand: true
    show-coordinates: false
    # Fully customizable hover lines — supports placeholders:
    # %check%, %vl%, %ping%, %tps%, %brand%, %debug%, %player%, %world%, %x%, %y%, %z%
    hover-lines:
      - '&8─────────────────'
      - '&9Truthful &8» &eDetails'
      - '&8─────────────────'
      - '&7Check: &f%check%'
      - '&7VL: &c%vl%'
      - '&7Ping: &b%ping%ms'
      - '&7TPS: &a%tps%'
      - '&7Client: &f%brand%'
      - '&7World: &f%world%'
      - '&8─────────────────'
      - '&7Debug: &e%debug%'
      - '&8─────────────────'

  bandwave-sweep: "&8[&5&lBANDWAVE&8] &7#%position% swept by the band wave: &f%player%"
  bandwave-queued: "&8[&5&lBANDWAVE&8] &f%player% &7was added to the BANDWAVE queue."
  bandwave-duplicate: "&8[&5&lBANDWAVE&8] &f%player% &7is already queued."
  bandwave-started: "&8[&5&lBANDWAVE&8] &7Execution started."
  bandwave-stopped: "&8[&5&lBANDWAVE&8] &7Execution stopped."
  bandwave-empty: "&8[&5&lBANDWAVE&8] &7Queue is empty."
  bandwave-cleared: "&8[&5&lBANDWAVE&8] &7Queue cleared."
  bandwave-status: "&8[&5&lBANDWAVE&8] &7Running: &f%running% &8| &7Queued: &f%queued%"
  bandwave-list-header: "&8[&5&lBANDWAVE&8] &7Queued players (&f%queued%&7):"
  bandwave-list-entry: "&8 - &f%position%. %player%"
  bandwave-usage: "&cUsage: /bandwave <add|remove|list|start|stop|clear|status> [player]"
  bandwave-disabled: "&8[&5&lBANDWAVE&8] &cBANDWAVE is disabled in config."
  bandwave-removed: "&8[&5&lBANDWAVE&8] &f%player% &7was removed from the queue."
  bandwave-schedule: "&8[&5&lBANDWAVE&8] &7Auto-start: &f%enabled% &8| &7Day: &f%day% &8| &7Time: &f%time%"

  commands:
    only-players: "&cOnly players can use this command."
    no-permission: "&cNo permission."
    no-data: "&cError: No data found."

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ #
#                               C H E C K S                                     #
#                                                                               #
#  How to configure:                                                            #
#  - lagback: Control exactly when the player gets rubber-banded (by VL).       #
#    When the player's violation level (VL) reaches the configured threshold,   #
#    they receive a server-forced position teleport to their setback target.     #
#  - punishment: Configure auto-kicks/bans at higher VL thresholds.             #
#  - bandwave: Set to 'true' to queue them for the ban wave instead of kicking. #
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ #
checks:

  # ❖ BEDROCK & GEYSER ❖
  # Checks specifically for Bedrock (Geyser/Floodgate) players who have different
  # physics and movement characteristics than Java players.
  BEDROCK:
    # BSpeed(A) — Bedrock horizontal speed limiter. Detects speed cheats on
    # bedrock players by capping ground/air speed with potion and ice modifiers.
    A:
      enabled: true
      lagback:
        enabled: true
        vl: 15
      punishment:
        enabled: true
        vl: 50
        command: "kick %player% [Truthful] Speed"
        bandwave: false
    # BFly(A) — Bedrock fly detection. Detects hover/rise beyond valid jump
    # apex (20 ticks + jump boost extension).
    B:
      enabled: true
      lagback:
        enabled: true
        vl: 15
      punishment:
        enabled: true
        vl: 50
        command: "kick %player% [Truthful] Fly"
        bandwave: false
    # BReach(A) — Bedrock reach detection. Detects impossibly long melee
    # attacks from bedrock players with ping-compensated hitbox checks.
    C:
      enabled: true
      lagback:
        enabled: true
        vl: 15
      punishment:
        enabled: true
        vl: 50
        command: "kick %player% [Truthful] Reach"
        bandwave: false

  # ❖ MOVEMENT & PHYSICS ❖
  # Simulation checks — the core physics prediction engine. These detect
  # vertical fly, horizontal speed, air strafe, and gravity bypasses.
  SIMULATION:
    # SimulationA — Primary physics simulation. Detects vertical fly (air-walk,
    # fly-dip, gravity bypass) and horizontal cheats (speed, air-strafe, ground
    # speed over cap). Most important movement check.
    A:
      enabled: true
      lagback:
        enabled: true
        vl: 35
      punishment:
        enabled: true
        vl: 350
        command: "kick %player% Unfair Advantage"
        bandwave: false
    # SimulationB — Elytra flight physics. Detects elytra speed cap violations,
    # spurious XZ gain, low drag, stall, energy rate anomalies, and illegal air
    # jumps. Only activates when gliding.
    B:
      enabled: false
      lagback:
        enabled: true
        vl: 5
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        bandwave: false
    # SimulationC — Liquid physics. Detects Jesus (water walking), vertical
    # hover/ascend/descend caps, and horizontal speed/drag violations in water
    # and lava. Includes depth strider, dolphin's grace, and bubble column support.
    C:
      enabled: true
      lagback:
        enabled: true
        vl: 75
      punishment:
        enabled: true
        vl: 350
        command: "kick %player% Unfair Advantage"
        bandwave: false
    # SimulationD — Vehicle & entity push physics. Detects speed/fly cheats on
    # boats (including ice variants), horses, camels, llamas, pigs, striders,
    # minecarts, and entity push exploits.
    D:
      enabled: true
      lagback:
        enabled: true
        vl: 75
      punishment:
        enabled: true
        vl: 350
        command: "kick %player% Unfair Advantage"
        bandwave: false

  VELOCITY:
    # VelocityA — Horizontal velocity (knockback) take check. Detects players
    # taking 0% or near-0% horizontal knockback after being hit.
    A:
      enabled: true
      lagback:
        enabled: true
        vl: 10
      punishment:
        enabled: true
        vl: 150
        command: "kick %player% Unfair Advantage"
        bandwave: false
    # VelocityB — Vertical velocity (knockback) take check. Detects players
    # taking 0% or near-0% vertical knockback.
    B:
      enabled: true
      lagback:
        enabled: true
        vl: 10
      punishment:
        enabled: true
        vl: 150
        command: "kick %player% Unfair Advantage"
        bandwave: false
    # VelocityC — Delayed velocity (tick 2-3) check. Detects velocity that was
    # delayed or partially taken on subsequent ticks after knockback.
    C:
      enabled: true
      lagback:
        enabled: true
        vl: 10
      punishment:
        enabled: true
        vl: 150
        command: "kick %player% Unfair Advantage"
        bandwave: false
    # VelocityD — Velocity ACK withholding. Detects players moving while
    # intentionally withholding velocity acknowledgment packets to hide
    # knockback reduction.
    D:
      enabled: true
      lagback:
        enabled: true
        vl: 10
      punishment:
        enabled: true
        vl: 150
        command: "kick %player% Unfair Advantage"
        bandwave: false

  SPOOF:
    # GroundSpoofB — (Not currently implemented or disabled)
    B:
      enabled: true
      lagback:
        enabled: false
      punishment:
        enabled: false
        vl: 100
        command: "kick %player% Unfair Advantage"
        bandwave: false
    # GroundSpoofC — Falling Ground Claim. Detects players claiming on-ground
    # while having significant downward velocity (falling fast but saying grounded).
    C:
      enabled: true
      lagback:
        enabled: true
        vl: 5
      punishment:
        enabled: true
        vl: 100
        command: "kick %player% Unfair Advantage"
        bandwave: false
    # GroundSpoofD — (Not currently implemented or disabled)
    D:
      enabled: true
      lagback:
        enabled: false
      punishment:
        enabled: true
        vl: 100
        command: "kick %player% Unfair Advantage"
        bandwave: false
    # GroundSpoofE — (Not currently implemented or disabled)
    E:
      enabled: true
      lagback:
        enabled: false
      punishment:
        enabled: true
        vl: 150
        command: "kick %player% Unfair Advantage"
        bandwave: false
    # GroundSpoofF — Physical Ground Spoof. Detects players claiming ground
    # when no solid block exists beneath them (thread-safe via block cache).
    F:
      enabled: true
      lagback:
        enabled: true
        vl: 5
      punishment:
        enabled: true
        vl: 150
        command: "kick %player% Unfair Advantage"
        bandwave: false
    # GroundSpoofG — Status Pulse Verification. Detects NoFall modules that
    # send Ground=True on rotation-only / non-position packets.
    G:
      enabled: true
      lagback:
        enabled: true
        vl: 5
      punishment:
        enabled: true
        vl: 150
        command: "kick %player% Unfair Advantage"
        bandwave: false

  TIMER:
    # TimerA — Game speed (timer) check. Detects clients running faster or
    # slower than normal game tick rate using transaction-based timing analysis.
    A:
      enabled: true
      lagback:
        enabled: true
        vl: 5
      punishment:
        enabled: true
        vl: 20
        command: "kick %player% Unfair Advantage"
        bandwave: false

  # ❖ COMBAT & HEURISTICS ❖
  KILLAURA:
    # KillAuraB — Movement Correlation (KeepSprint). Detects omni-directional
    # sprinting while attacking (directional dot check) and keep-sprint after hits.
    B:
      enabled: true
      lagback:
        enabled: true
        vl: 15
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        bandwave: false
    # KillAuraC — Robotic Aim Analysis. Detects snap-and-stop aim patterns
    # (large rotation >30 deg followed instantly by <0.1 deg).
    C:
      enabled: true
      lagback:
        enabled: true
        vl: 15
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        bandwave: false
    # KillAuraD — Silent/Packet Rotation / Pitch Lock. Detects yaw changes
    # >15 deg with exactly 0 pitch change (pitch lock) and pitch changes >10
    # with near-zero yaw (vertical snap).
    D:
      enabled: true
      lagback:
        enabled: true
        vl: 5
      punishment:
        enabled: true
        vl: 15
        command: "kick %player% Unfair Advantage"
        bandwave: false
    # KillAuraE — Wall Hit Detection (Async Raytrace). Detects attacks that
    # pass through solid blocks using async raytrace with ping compensation.
    E:
      enabled: true
      lagback:
        enabled: true
        vl: 5
      punishment:
        enabled: true
        vl: 15
        command: "kick %player% Unfair Advantage"
        bandwave: false
    # KillAuraF — Packet Criticals. Detects clients sending tiny hops
    # (<0.2 vertical) mid-combat to fake critical hit conditions.
    F:
      enabled: true
      lagback:
        enabled: true
        vl: 5
      punishment:
        enabled: true
        vl: 15
        command: "kick %player% Unfair Advantage"
        bandwave: false
    # KillAuraG — Multi-Target Detection. Detects 3+ unique attack targets
    # within a 500ms window (impossible for legitimate players).
    G:
      enabled: true
      lagback:
        enabled: true
        vl: 5
      punishment:
        enabled: true
        vl: 15
        command: "kick %player% Unfair Advantage"
        bandwave: false
    # KillAuraH — Attack Interval Analysis. Detects low-variance, quantized,
    # or perfectly-rounded CPS values indicating autoclicker/aimbot patterns.
    H:
      enabled: true
      lagback:
        enabled: true
        vl: 10
      punishment:
        enabled: false
        vl: 50
        command: "kick %player% Unfair Advantage"
        bandwave: false

  AIM:
    # AimA through AimL — Rotation analysis checks. Detect aim-assist, silent
