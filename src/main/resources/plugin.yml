name: TruthfulAC
version: '0.9'
main: ret.tawny.truthful.TruthfulPlugin
api-version: '1.21'
author: Tawny(CodeControl)
description: Multi-version anti-cheat with modernized movement and combat checks
load: POSTWORLD
depend:
  - packetevents
folia-supported: true

commands:
  truthful:
    description: Main command for Truthful Anti-Cheat
    usage: /truthful <help|logs|exempt|menu>
    aliases: [tac, ac]
    permission: truthful.admin
  alerts:
    description: Toggle anti-cheat alerts
    usage: /alerts
    permission: truthful.alerts
  banwave:
    description: Manage BANWAVE queue and execution
    usage: /banwave <add|remove|list|start|stop|clear|status>
    permission: truthful.admin
permissions:
  truthful.admin:
    description: Admin permission for Truthful
    default: op
  truthful.alerts:
    description: Receive alerts
    default: op